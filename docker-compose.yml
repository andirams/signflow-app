version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: signflow-postgres
    environment:
      POSTGRES_USER: signflow_user
      POSTGRES_PASSWORD: signflow_password
      POSTGRES_DB: signflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
